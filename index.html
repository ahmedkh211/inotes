<div class="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-doc"/></svg></span>
      <h1 class="brand-name">iNotes</h1>
    </div>
    <div class="header-actions">
      <button id="hdrAdd" class="btn primary hdr-add" data-action="new-note" type="button">
        <svg class="icon sm"><use href="#i-add"/></svg><span>نوتة جديدة</span>
      </button>
      <button id="installBtn" class="chip accent hidden" type="button">
        <svg class="icon sm"><use href="#i-install"/></svg><span>تثبيت التطبيق</span>
      </button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="الإعدادات">
        <svg class="icon"><use href="#i-gear"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="تبديل المظهر">
        <svg class="icon"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="search-row">
      <div class="search-wrap">
        <svg class="icon sm search-ic"><use href="#i-search"/></svg>
        <input id="searchInput" class="search-input" type="search" placeholder="ابحث في نوتاتك…" autocomplete="off" aria-label="البحث في النوتات">
        <button id="searchClear" class="icon-btn sm search-clear hidden" type="button" aria-label="مسح البحث"><svg class="icon sm"><use href="#i-close"/></svg></button>
      </div>
      <span id="notesCount" class="notes-count"></span>
    </div>

    <section id="view-grid" class="view active">
      <ul id="notesGrid" class="notes-grid" aria-label="كل النوتات"></ul>
      <div id="notesEmpty" class="empty hidden">
        <div class="empty-icon-wrap"><svg class="empty-icon"><use href="#i-doc"/></svg></div>
        <h3>لا توجد نوتات بعد</h3>
        <p>اكتب أو ارسم أو سجّل صوتك — كل شيء يعمل دون اتصال</p>
        <button class="btn primary" data-action="new-note" type="button"><svg class="icon sm"><use href="#i-add"/></svg> نوتة جديدة</button>
      </div>
      <div id="notesNoResult" class="empty hidden">
        <div class="empty-icon-wrap"><svg class="empty-icon"><use href="#i-search"/></svg></div>
        <h3>لا نتائج مطابقة</h3>
        <p>جرّب كلمة بحث مختلفة</p>
      </div>
    </section>
  </main>

  <button id="fab" class="fab" type="button" aria-label="نوتة جديدة">
    <svg class="icon"><use href="#i-add"/></svg>
    <span class="fab-t">نوتة جديدة</span>
  </button>
</div>

<div id="installHint" class="banner hint hidden">
  <svg class="icon accent"><use href="#i-install"/></svg>
  <span>لتثبيت iNotes: من قائمة المتصفح (⋮) اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</span>
  <button id="installHintDismiss" class="icon-btn sm" type="button" aria-label="إخفاء"><svg class="icon"><use href="#i-close"/></svg></button>
</div>

<div id="edBackdrop" class="np-backdrop"></div>
<div id="edSheet" class="ed-sheet" aria-hidden="true" role="dialog" aria-label="محرر النوتة">
  <div class="ed-inner">
    <header class="ed-top">
      <button id="edClose" class="icon-btn" type="button" aria-label="حفظ وإغلاق"><svg class="icon"><use href="#i-down"/></svg></button>
      <div class="ed-top-mid">
        <span id="saveDot" class="save-dot">تم الحفظ ✓</span>
        <span id="edLabel" class="ed-label">نوتة جديدة</span>
      </div>
      <button id="edMore" class="icon-btn" type="button" aria-label="خيارات النوتة"><svg class="icon"><use href="#i-more"/></svg></button>
    </header>

    <div class="ed-note-color" id="edColorRow" role="group" aria-label="لون النوتة"></div>

    <input id="edTitle" class="ed-title" type="text" maxlength="120" placeholder="العنوان…" autocomplete="off" aria-label="عنوان النوتة">

    <div class="ed-toolbar" id="edToolbar" role="toolbar" aria-label="تنسيق النص">
      <div class="ed-tools-row1">
        <button class="tool-btn" data-cmd="bold" type="button" aria-label="عريض" title="عريض"><svg class="icon sm"><use href="#i-bold"/></svg></button>
        <button class="tool-btn" data-cmd="italic" type="button" aria-label="مائل" title="مائل"><svg class="icon sm"><use href="#i-italic"/></svg></button>
        <button class="tool-btn" data-cmd="underline" type="button" aria-label="تسطير" title="تسطير"><svg class="icon sm"><use href="#i-underline"/></svg></button>
        <button class="tool-btn" data-cmd="strikeThrough" type="button" aria-label="مشطوب" title="مشطوب"><svg class="icon sm"><use href="#i-strike"/></svg></button>
        <button class="tool-btn" data-cmd="insertUnorderedList" type="button" aria-label="قائمة نقطية" title="قائمة نقطية"><svg class="icon sm"><use href="#i-list"/></svg></button>
        <button class="tool-btn" id="textColorBtn" type="button" aria-label="لون النص" title="لون النص"><svg class="icon sm"><use href="#i-text-color"/></svg></button>
        <button class="tool-btn" id="highlightBtn" type="button" aria-label="تظليل" title="تظليل"><svg class="icon sm"><use href="#i-highlight"/></svg></button>
        <button class="tool-btn" id="sizeBtn" type="button" aria-label="حجم الخط" title="حجم الخط"><svg class="icon sm"><use href="#i-size"/></svg></button>
        <button class="tool-btn" id="fontBtn" type="button" aria-label="الخط" title="الخط"><b class="aa-lbl">أ</b></button>
      </div>
      <div class="ed-tools-row2">
        <button class="tool-btn wide" id="emojiBtn" type="button" aria-label="إدراج إيموجي" title="إيموجي"><svg class="icon sm"><use href="#i-smile"/></svg> إيموجي</button>
        <button class="tool-btn wide" id="drawBtn" type="button" aria-label="الكتابة بخط اليد" title="خط اليد"><svg class="icon sm"><use href="#i-brush"/></svg> خط اليد</button>
        <button class="tool-btn wide" id="micBtn" type="button" aria-label="نوتة صوتية" title="نوتة صوتية"><svg class="icon sm"><use href="#i-mic"/></svg> <span id="micLabel">صوتي</span></button>
        <span id="recTimer" class="rec-timer hidden">0:00</span>
      </div>
    </div>

    <div id="drawArea" class="draw-area hidden">
      <div class="draw-tools">
        <div class="draw-colors" id="drawColors" role="group" aria-label="لون القلم"></div>
        <div class="draw-sizes" id="drawSizes" role="group" aria-label="سماكة القلم"></div>
        <button id="drawErase" class="tool-btn sm" type="button" aria-label="ممحاة"><svg class="icon sm"><use href="#i-erase"/></svg></button>
        <button id="drawUndo" class="tool-btn sm" type="button" aria-label="تراجع"><svg class="icon sm"><use href="#i-undo"/></svg></button>
        <button id="drawDone" class="tool-btn sm ok" type="button" aria-label="إدراج الرسمة"><svg class="icon sm"><use href="#i-check"/></svg> إدراج</button>
      </div>
      <div class="draw-canvas-wrap">
        <canvas id="drawCanvas" aria-label="لوحة الرسم"></canvas>
      </div>
    </div>

    <div id="edBodyWrap" class="ed-body-wrap">
      <div id="edBody" class="ed-body" contenteditable="true" data-placeholder="اكتب هنا… والكل يُحفظ تلقائياً" aria-label="محتوى النوتة"></div>
    </div>
  </div>
</div>

<div id="modalRoot" class="modal-layer" hidden>
  <div id="modalBackdrop" class="modal-backdrop"></div>
  <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<div id="updateBanner" class="banner update hidden">
  <svg class="icon accent"><use href="#i-refresh"/></svg>
  <span>يتوفر إصدار جديد من iNotes</span>
  <button id="updateBtn" class="btn primary sm" type="button">تحديث الآن</button>
  <button id="updateDismiss" class="icon-btn sm" type="button" aria-label="إخفاء"><svg class="icon"><use href="#i-close"/></svg></button>
</div>

<input id="importFile" type="file" accept="application/json,.json" hidden>
<audio id="voiceAudio" preload="metadata"></audio>
<script src="./app.js"></script>
</body>
</html>
